<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家事ダッシュボード - 家事ポイント管理システム</title>
    <style>
        /* 基本スタイル設定 - レスポンシブ対応 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Kaku Gothic Pro', 'ヒラギノ角ゴ Pro W3', Meiryo, メイリオ, Osaka, 'MS PGothic', arial, helvetica, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
            border-bottom: 2px solid #eee;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        /* タブナビゲーション */
        .tab-nav {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-button {
            background: #f8f9fa;
            border: none;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            color: #495057;
        }

        .tab-button.active {
            background: #007bff;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }

        .tab-button:hover {
            background: #e9ecef;
            transform: translateY(-1px);
        }

        .tab-button.active:hover {
            background: #0056b3;
        }

        /* タブコンテンツ */
        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease-in;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ユーザー管理セクション */
        .user-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .user-selector {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .user-selector select, .user-selector input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .add-user-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-user-btn:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        /* フォームスタイル */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .form-group select,
        .form-group input[type="number"],
        .form-group input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }

        /* ボタンスタイル */
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .btn:hover {
            background: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #218838;
        }

        /* ダッシュボードスタイル */
        .dashboard {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }

        .user-stats {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        .user-stats h3 {
            margin-bottom: 15px;
            font-size: 1.8em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        /* リーダーボード */
        .leaderboard {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .leaderboard h3 {
            background: #343a40;
            color: white;
            padding: 20px;
            margin: 0;
            text-align: center;
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            transition: background 0.3s ease;
        }

        .rank-item:hover {
            background: #f8f9fa;
        }

        .rank-item:last-child {
            border-bottom: none;
        }

        .rank-number {
            background: #007bff;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .rank-number.gold { background: #ffd700; color: #333; }
        .rank-number.silver { background: #c0c0c0; color: #333; }
        .rank-number.bronze { background: #cd7f32; color: white; }

        /* 家事記録表示 */
        .record-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .record-item:last-child {
            border-bottom: none;
        }

        .record-info {
            flex: 1;
        }

        .record-task {
            font-weight: bold;
            color: #333;
        }

        .record-details {
            font-size: 0.9em;
            color: #666;
            margin-top: 2px;
        }

        .record-points {
            background: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-weight: bold;
        }

        /* レスポンシブデザイン */
        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
                min-height: 100vh;
                padding: 15px;
            }

            .header h1 {
                font-size: 2em;
            }

            .tab-nav {
                overflow-x: auto;
                justify-content: flex-start;
                padding-bottom: 10px;
            }

            .tab-button {
                flex-shrink: 0;
                padding: 10px 15px;
            }

            .user-selector {
                flex-direction: column;
                align-items: stretch;
            }

            .user-selector select,
            .user-selector input {
                width: 100%;
                margin-bottom: 10px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .dashboard {
                gap: 15px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .rank-item {
                padding: 12px 15px;
            }

            .record-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }

        /* ローディングアニメーション */
        .loading {
            text-align: center;
            padding: 40px;
        }

        .loading::after {
            content: '';
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ヘッダーセクション -->
        <header class="header">
            <h1>🏠 家事ダッシュボード</h1>
            <p>家事を点数化してモチベーションアップ！みんなで家事を楽しく競争しよう</p>
        </header>

        <!-- ユーザー管理セクション -->
        <div class="user-section">
            <h3>👥 ユーザー選択</h3>
            <div class="user-selector">
                <select id="currentUser">
                    <option value="">ユーザーを選択してください</option>
                </select>
                <input type="text" id="newUserName" placeholder="新しいユーザー名を入力">
                <button class="add-user-btn" onclick="addUser()">ユーザー追加</button>
            </div>
        </div>

        <!-- タブナビゲーション -->
        <nav class="tab-nav">
            <button class="tab-button active" onclick="showTab('dashboard')">📊 ダッシュボード</button>
            <button class="tab-button" onclick="showTab('record')">📝 家事記録</button>
            <button class="tab-button" onclick="showTab('manage')">⚙️ 家事管理</button>
        </nav>

        <!-- ダッシュボードタブ -->
        <div id="dashboard" class="tab-content active">
            <div class="dashboard">
                <div class="user-stats">
                    <h3 id="currentUserStats">統計情報</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-value" id="todayPoints">0</span>
                            <span class="stat-label">今日の獲得ポイント</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="totalPoints">0</span>
                            <span class="stat-label">総獲得ポイント</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="taskCount">0</span>
                            <span class="stat-label">今日の完了家事</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="currentRank">-</span>
                            <span class="stat-label">現在の順位</span>
                        </div>
                    </div>
                </div>

                <div class="leaderboard">
                    <h3>🏆 ランキング（今月）</h3>
                    <div id="leaderboardList">
                        <div class="loading">データを読み込み中...</div>
                    </div>
                </div>
            </div>

            <!-- 最近の家事記録 -->
            <div style="margin-top: 30px;">
                <h3>📋 最近の家事記録</h3>
                <div class="record-list" id="recentRecords">
                    <div class="loading">データを読み込み中...</div>
                </div>
            </div>
        </div>

        <!-- 家事記録タブ -->
        <div id="record" class="tab-content">
            <h3>📝 家事を記録する</h3>
            
            <div class="form-group">
                <label for="taskSelect">家事の種類:</label>
                <select id="taskSelect">
                    <option value="">家事を選択してください</option>
                </select>
            </div>

            <div class="form-group">
                <label for="timeSpent">実行時間（分）:</label>
                <select id="timeSpent">
                    <option value="10">10分</option>
                    <option value="20">20分</option>
                    <option value="30">30分</option>
                    <option value="40">40分</option>
                    <option value="50">50分</option>
                    <option value="60">60分</option>
                    <option value="90">90分</option>
                    <option value="120">120分</option>
                </select>
            </div>

            <div class="form-group">
                <label for="calculatedPoints">獲得予定ポイント:</label>
                <input type="number" id="calculatedPoints" readonly style="background: #f8f9fa;">
            </div>

            <button class="btn btn-success" onclick="recordTask()">家事を記録する</button>

            <div style="margin-top: 30px;">
                <h4>📊 今日の記録</h4>
                <div class="record-list" id="todayRecords">
                    <div class="loading">データを読み込み中...</div>
                </div>
            </div>
        </div>

        <!-- 家事管理タブ -->
        <div id="manage" class="tab-content">
            <h3>⚙️ 家事項目管理</h3>

            <!-- 新しい家事項目追加 -->
            <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 30px;">
                <h4>➕ 新しい家事項目を追加</h4>
                
                <div class="form-group">
                    <label for="newTaskName">家事名:</label>
                    <input type="text" id="newTaskName" placeholder="例: 洗車">
                </div>

                <div class="form-group">
                    <label for="newTaskPoints">基本点数（10分あたり）:</label>
                    <input type="number" id="newTaskPoints" min="1" max="10" placeholder="1-10点">
                </div>

                <button class="btn" onclick="addNewTask()">家事項目を追加</button>
            </div>

            <!-- 既存の家事項目一覧 -->
            <div>
                <h4>📋 現在の家事項目</h4>
                <div id="taskList" class="record-list">
                    <div class="loading">データを読み込み中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // グローバル変数とデータ構造の定義
        // ============================================================

        // 現在選択中のユーザーID
        let currentUser = '';

        // デフォルトの家事項目とその基本点数（10分あたり）
        const defaultTasks = {
            'cooking': { name: '調理', basePoints: 3 },
            'dishwashing': { name: '皿洗い', basePoints: 2 },
            'laundry': { name: '洗濯', basePoints: 1 },
            'hanging': { name: '洗濯干し', basePoints: 2 },
            'folding': { name: '衣類たたみ', basePoints: 2 },
            'ironing': { name: 'アイロン', basePoints: 4 },
            'bathroom': { name: '風呂掃除', basePoints: 5 },
            'trash': { name: 'ゴミ出し', basePoints: 1 },
            'cleaning': { name: '部屋掃除', basePoints: 3 }
        };

        // ============================================================
        // 初期化処理
        // ============================================================

        /**
         * ページ読み込み時の初期化処理
         * ローカルストレージからデータを読み込み、UIを初期化する
         */
        function initializeApp() {
            console.log('アプリケーションを初期化中...');
            
            // ステップ1: ローカルストレージの初期化
            initializeLocalStorage();
            
            // ステップ2: UIコンポーネントの初期化
            loadUsers();
            loadTasks();
            
            // ステップ3: イベントリスナーの設定
            setupEventListeners();
            
            console.log('アプリケーションの初期化が完了しました');
        }

        /**
         * ローカルストレージの初期化
         * 初回起動時にデフォルトデータを設定する
         */
        function initializeLocalStorage() {
            // ユーザーデータの初期化
            if (!localStorage.getItem('houseworkUsers')) {
                localStorage.setItem('houseworkUsers', JSON.stringify({}));
            }
            
            // 家事項目データの初期化
            if (!localStorage.getItem('houseworkTasks')) {
                localStorage.setItem('houseworkTasks', JSON.stringify(defaultTasks));
            }
            
            // 家事記録データの初期化
            if (!localStorage.getItem('houseworkRecords')) {
                localStorage.setItem('houseworkRecords', JSON.stringify([]));
            }
        }

        // ============================================================
        // ユーザー管理機能
        // ============================================================

        /**
         * ユーザー一覧をローカルストレージから読み込んでセレクトボックスに表示
         */
        function loadUsers() {
            const users = JSON.parse(localStorage.getItem('houseworkUsers') || '{}');
            const userSelect = document.getElementById('currentUser');
            
            // セレクトボックスをクリア（デフォルトオプションは残す）
            userSelect.innerHTML = '<option value="">ユーザーを選択してください</option>';
            
            // 各ユーザーをセレクトボックスに追加
            Object.keys(users).forEach(userId => {
                const option = document.createElement('option');
                option.value = userId;
                option.textContent = users[userId].name;
                userSelect.appendChild(option);
            });
        }

        /**
         * 新しいユーザーを追加する
         * 入力値の検証を行い、重複チェックも実施する
         */
        function addUser() {
            const nameInput = document.getElementById('newUserName');
            const name = nameInput.value.trim();
            
            // 入力値検証
            if (!name) {
                alert('ユーザー名を入力してください');
                return;
            }
            
            if (name.length > 20) {
                alert('ユーザー名は20文字以内で入力してください');
                return;
            }
            
            // 既存ユーザーの重複チェック
            const users = JSON.parse(localStorage.getItem('houseworkUsers') || '{}');
            const existingUser = Object.values(users).find(user => user.name === name);
            
            if (existingUser) {
                alert('同じ名前のユーザーが既に存在します');
                return;
            }
            
            // 新しいユーザーを作成
            const userId = 'user_' + Date.now(); // 一意のIDを生成
            users[userId] = {
                name: name,
                totalPoints: 0,
                createdAt: new Date().toISOString()
            };
            
            // ローカルストレージに保存
            localStorage.setItem('houseworkUsers', JSON.stringify(users));
            
            // UI更新
            nameInput.value = '';
            loadUsers();
            
            // 新しく追加されたユーザーを自動選択
            document.getElementById('currentUser').value = userId;
            selectUser(userId);
            
            console.log('新しいユーザーが追加されました:', name);
        }

        /**
         * ユーザーを選択した時の処理
         * 選択されたユーザーの情報でダッシュボードを更新する
         */
        function selectUser(userId) {
            currentUser = userId;
            
            if (!userId) {
                // ユーザーが選択されていない場合の処理
                updateDashboard();
                return;
            }
            
            console.log('ユーザーが選択されました:', userId);
            updateDashboard();
            updateRecordDisplay();
        }

        // ============================================================
        // タブ管理機能
        // ============================================================

        /**
         * タブを切り替える
         * アクティブなタブを変更し、対応するコンテンツを表示する
         */
        function showTab(tabName) {
            // 全てのタブボタンからactiveクラスを削除
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // 全てのタブコンテンツを非表示
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // 選択されたタブボタンにactiveクラスを追加
            event.target.classList.add('active');
            
            // 選択されたタブコンテンツを表示
            document.getElementById(tabName).classList.add('active');
            
            // タブ切り替え時の追加処理
            if (tabName === 'dashboard') {
                updateDashboard();
            } else if (tabName === 'record') {
                updateRecordDisplay();
            } else if (tabName === 'manage') {
                updateTaskList();
            }
            
            console.log('タブが切り替わりました:', tabName);
        }

        // ============================================================
        // 家事項目管理機能
        // ============================================================

        /**
         * 家事項目一覧をローカルストレージから読み込む
         */
        function loadTasks() {
            const tasks = JSON.parse(localStorage.getItem('houseworkTasks') || '{}');
            const taskSelect = document.getElementById('taskSelect');
            
            // セレクトボックスをクリア
            taskSelect.innerHTML = '<option value="">家事を選択してください</option>';
            
            // 各家事項目をセレクトボックスに追加
            Object.keys(tasks).forEach(taskId => {
                const option = document.createElement('option');
                option.value = taskId;
                option.textContent = `${tasks[taskId].name} (${tasks[taskId].basePoints}pt/10分)`;
                taskSelect.appendChild(option);
            });
        }

        /**
         * 新しい家事項目を追加する
         * 入力値の検証と重複チェックを行う
         */
        function addNewTask() {
            const nameInput = document.getElementById('newTaskName');
            const pointsInput = document.getElementById('newTaskPoints');
            
            const name = nameInput.value.trim();
            const points = parseInt(pointsInput.value);
            
            // 入力値検証
            if (!name) {
                alert('家事名を入力してください');
                return;
            }
            
            if (isNaN(points) || points < 1 || points > 10) {
                alert('基本点数は1から10の間で入力してください');
                return;
            }
            
            // 既存項目の重複チェック
            const tasks = JSON.parse(localStorage.getItem('houseworkTasks') || '{}');
            const existingTask = Object.values(tasks).find(task => task.name === name);
            
            if (existingTask) {
                alert('同じ名前の家事項目が既に存在します');
                return;
            }
            
            // 新しい家事項目を作成
            const taskId = 'custom_' + Date.now();
            tasks[taskId] = {
                name: name,
                basePoints: points,
                custom: true,
                createdAt: new Date().toISOString()
            };
            
            // ローカルストレージに保存
            localStorage.setItem('houseworkTasks', JSON.stringify(tasks));
            
            // UI更新
            nameInput.value = '';
            pointsInput.value = '';
            loadTasks();
            updateTaskList();
            
            console.log('新しい家事項目が追加されました:', name);
            alert('家事項目が追加されました');
        }

        /**
         * 家事項目一覧の表示を更新する
         */
        function updateTaskList() {
            const tasks = JSON.parse(localStorage.getItem('houseworkTasks') || '{}');
            const taskList = document.getElementById('taskList');
            
            if (Object.keys(tasks).length === 0) {
                taskList.innerHTML = '<div style="text-align: center; padding: 20px; color: #666;">家事項目がありません</div>';
                return;
            }
            
            let html = '';
            Object.keys(tasks).forEach(taskId => {
                const task = tasks[taskId];
                const isCustom = task.custom || false;
                
                html += `
                    <div class="record-item">
                        <div class="record-info">
                            <div class="record-task">${task.name}</div>
                            <div class="record-details">
                                基本点数: ${task.basePoints}pt/10分
                                ${isCustom ? ' (カスタム項目)' : ' (デフォルト項目)'}
                            </div>
                        </div>
                        <div>
                            ${isCustom ? `<button class="btn" style="padding: 5px 10px; font-size: 12px; background: #dc3545;" onclick="deleteTask('${taskId}')">削除</button>` : ''}
                        </div>
                    </div>
                `;
            });
            
            taskList.innerHTML = html;
        }

        /**
         * カスタム家事項目を削除する
         * デフォルト項目は削除できない
         */
        function deleteTask(taskId) {
            if (!confirm('この家事項目を削除してもよろしいですか？')) {
                return;
            }
            
            const tasks = JSON.parse(localStorage.getItem('houseworkTasks') || '{}');
            
            // デフォルト項目の削除を防ぐ
            if (!tasks[taskId].custom) {
                alert('デフォルト項目は削除できません');
                return;
            }
            
            delete tasks[taskId];
            localStorage.setItem('houseworkTasks', JSON.stringify(tasks));
            
            loadTasks();
            updateTaskList();
            
            console.log('家事項目が削除されました:', taskId);
        }

        // ============================================================
        // 家事記録機能
        // ============================================================

        /**
         * 家事を記録する
         * ポイント計算と記録の保存を行う
         */
        function recordTask() {
            if (!currentUser) {
                alert('まずユーザーを選択してください');
                return;
            }
            
            const taskId = document.getElementById('taskSelect').value;
            const timeSpent = parseInt(document.getElementById('timeSpent').value);
            
            if (!taskId) {
                alert('家事の種類を選択してください');
                return;
            }
            
            // ポイント計算
            const tasks = JSON.parse(localStorage.getItem('houseworkTasks') || '{}');
            const task = tasks[taskId];
            const points = calculatePoints(task.basePoints, timeSpent);
            
            // 記録の作成
            const record = {
                id: 'record_' + Date.now(),
                userId: currentUser,
                taskId: taskId,
                taskName: task.name,
                timeSpent: timeSpent,
                points: points,
                timestamp: new Date().toISOString(),
                date: new Date().toDateString()
            };
            
            // ローカルストレージに記録を保存
            const records = JSON.parse(localStorage.getItem('houseworkRecords') || '[]');
            records.push(record);
            localStorage.setItem('houseworkRecords', JSON.stringify(records));
            
            // ユーザーの総ポイントを更新
            const users = JSON.parse(localStorage.getItem('houseworkUsers') || '{}');
            users[currentUser].totalPoints += points;
            localStorage.setItem('houseworkUsers', JSON.stringify(users));
            
            // UI更新
            document.getElementById('taskSelect').value = '';
            document.getElementById('timeSpent').value = '10';
            document.getElementById('calculatedPoints').value = '';
            
            updateDashboard();
            updateRecordDisplay();
            
            console.log('家事が記録されました:', record);
            alert(`家事が記録されました！獲得ポイント: ${points}pt`);
        }

        /**
         * ポイントを計算する
         * 基本点数と実行時間から獲得ポイントを算出
         */
        function calculatePoints(basePoints, timeSpent) {
            // 10分単位でポイントを計算（端数は切り上げ）
            const units = Math.ceil(timeSpent / 10);
            return basePoints * units;
        }

        /**
         * 家事選択と時間変更時にポイントプレビューを更新
         */
        function updatePointsPreview() {
            const taskId = document.getElementById('taskSelect').value;
            const timeSpent = parseInt(document.getElementById('timeSpent').value);
            const pointsInput = document.getElementById('calculatedPoints');
            
            if (!taskId) {
                pointsInput.value = '';
                return;
            }
            
            const tasks = JSON.parse(localStorage.getItem('houseworkTasks') || '{}');
            const task = tasks[taskId];
            const points = calculatePoints(task.basePoints, timeSpent);
            
            pointsInput.value = points;
        }

        // ============================================================
        // ダッシュボード機能
        // ============================================================

        /**
         * ダッシュボードの表示を更新する
         * 統計情報とランキングを最新データで更新
         */
        function updateDashboard() {
            updateUserStats();
            updateLeaderboard();
            updateRecentRecords();
        }

        /**
         * 現在のユーザーの統計情報を更新
         */
        function updateUserStats() {
            const currentUserStats = document.getElementById('currentUserStats');
            const todayPointsEl = document.getElementById('todayPoints');
            const totalPointsEl = document.getElementById('totalPoints');
            const taskCountEl = document.getElementById('taskCount');
            const currentRankEl = document.getElementById('currentRank');
            
            if (!currentUser) {
                currentUserStats.textContent = 'ユーザーを選択してください';
                todayPointsEl.textContent = '0';
                totalPointsEl.textContent = '0';
                taskCountEl.textContent = '0';
                currentRankEl.textContent = '-';
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('houseworkUsers') || '{}');
            const records = JSON.parse(localStorage.getItem('houseworkRecords') || '[]');
            
            const userName = users[currentUser].name;
            const totalPoints = users[currentUser].totalPoints;
            
            // 今日の記録を取得
            const today = new Date().toDateString();
            const todayRecords = records.filter(record => 
                record.userId === currentUser && record.date === today
            );
            
            const todayPoints = todayRecords.reduce((sum, record) => sum + record.points, 0);
            const taskCount = todayRecords.length;
            
            // ランキング計算
            const allUsers = Object.keys(users).map(userId => ({
                userId: userId,
                name: users[userId].name,
                points: users[userId].totalPoints
            })).sort((a, b) => b.points - a.points);
            
            const currentRank = allUsers.findIndex(user => user.userId === currentUser) + 1;
            
            // UI更新
            currentUserStats.textContent = `${userName}さんの統計`;
            todayPointsEl.textContent = todayPoints;
            totalPointsEl.textContent = totalPoints;
            taskCountEl.textContent = taskCount;
            currentRankEl.textContent = currentRank > 0 ? `${currentRank}位` : '-';
        }

        /**
         * リーダーボードを更新
         */
        function updateLeaderboard() {
            const users = JSON.parse(localStorage.getItem('houseworkUsers') || '{}');
            const leaderboardList = document.getElementById('leaderboardList');
            
            if (Object.keys(users).length === 0) {
                leaderboardList.innerHTML = '<div style="text-align: center; padding: 20px; color: #666;">ユーザーがいません</div>';
                return;
            }
            
            // ユーザーをポイント順でソート
            const sortedUsers = Object.keys(users).map(userId => ({
                userId: userId,
                name: users[userId].name,
                points: users[userId].totalPoints
            })).sort((a, b) => b.points - a.points);
            
            let html = '';
            sortedUsers.forEach((user, index) => {
                const rank = index + 1;
                let rankClass = '';
                
                if (rank === 1) rankClass = 'gold';
                else if (rank === 2) rankClass = 'silver';
                else if (rank === 3) rankClass = 'bronze';
                
                const isCurrentUser = user.userId === currentUser;
                
                html += `
                    <div class="rank-item" style="${isCurrentUser ? 'background: #e3f2fd; border-left: 4px solid #2196f3;' : ''}">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <div class="rank-number ${rankClass}">${rank}</div>
                            <div>
                                <div style="font-weight: bold; color: #333;">${user.name}${isCurrentUser ? ' (あなた)' : ''}</div>
                            </div>
                        </div>
                        <div style="font-weight: bold; color: #007bff; font-size: 1.2em;">${user.points}pt</div>
                    </div>
                `;
            });
            
            leaderboardList.innerHTML = html;
        }

        /**
         * 最近の家事記録を更新
         */
        function updateRecentRecords() {
            const records = JSON.parse(localStorage.getItem('houseworkRecords') || '[]');
            const recentRecordsEl = document.getElementById('recentRecords');
            
            // 最新の10件を取得
            const recentRecords = records
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
                .slice(0, 10);
            
            if (recentRecords.length === 0) {
                recentRecordsEl.innerHTML = '<div style="text-align: center; padding: 20px; color: #666;">記録がありません</div>';
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('houseworkUsers') || '{}');
            
            let html = '';
            recentRecords.forEach(record => {
                const userName = users[record.userId].name;
                const date = new Date(record.timestamp).toLocaleString('ja-JP');
                
                html += `
                    <div class="record-item">
                        <div class="record-info">
                            <div class="record-task">${record.taskName}</div>
                            <div class="record-details">
                                ${userName} • ${record.timeSpent}分 • ${date}
                            </div>
                        </div>
                        <div class="record-points">${record.points}pt</div>
                    </div>
                `;
            });
            
            recentRecordsEl.innerHTML = html;
        }

        /**
         * 家事記録関連の表示を更新
         */
        function updateRecordDisplay() {
            updateTodayRecords();
        }

        /**
         * 今日の記録を更新
         */
        function updateTodayRecords() {
            if (!currentUser) {
                document.getElementById('todayRecords').innerHTML = '<div style="text-align: center; padding: 20px; color: #666;">ユーザーを選択してください</div>';
                return;
            }
            
            const records = JSON.parse(localStorage.getItem('houseworkRecords') || '[]');
            const today = new Date().toDateString();
            
            const todayRecords = records.filter(record => 
                record.userId === currentUser && record.date === today
            ).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            const todayRecordsEl = document.getElementById('todayRecords');
            
            if (todayRecords.length === 0) {
                todayRecordsEl.innerHTML = '<div style="text-align: center; padding: 20px; color: #666;">今日の記録はありません</div>';
                return;
            }
            
            let html = '';
            todayRecords.forEach(record => {
                const time = new Date(record.timestamp).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
                
                html += `
                    <div class="record-item">
                        <div class="record-info">
                            <div class="record-task">${record.taskName}</div>
                            <div class="record-details">
                                ${record.timeSpent}分 • ${time}
                            </div>
                        </div>
                        <div class="record-points">${record.points}pt</div>
                    </div>
                `;
            });
            
            todayRecordsEl.innerHTML = html;
        }

        // ============================================================
        // イベントリスナーの設定
        // ============================================================

        /**
         * 各種イベントリスナーを設定する
         */
        function setupEventListeners() {
            // ユーザー選択の変更
            document.getElementById('currentUser').addEventListener('change', function() {
                selectUser(this.value);
            });
            
            // 家事選択と時間の変更
            document.getElementById('taskSelect').addEventListener('change', updatePointsPreview);
            document.getElementById('timeSpent').addEventListener('change', updatePointsPreview);
            
            // Enter キーでの操作
            document.getElementById('newUserName').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addUser();
                }
            });
            
            document.getElementById('newTaskName').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addNewTask();
                }
            });
            
            document.getElementById('newTaskPoints').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addNewTask();
                }
            });
        }

        // ============================================================
        // アプリケーション開始
        // ============================================================

        // DOMが読み込まれた時にアプリケーションを初期化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM読み込み完了 - アプリケーション初期化開始');
            initializeApp();
        });
    </script>
</body>
</html>
